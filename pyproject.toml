[project]
name = "forecast-qa"
version = "0.1.0"
description = "Contrato, parser y métricas para la planilla Mann de pronósticos"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
forecast-qa = "forecast_qa.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
